<!DOCTYPE html>
<html lang="en">
<head>

    <script>
        (function () {
            var stored = localStorage.getItem("ut-theme");
            var theme = stored || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
            document.documentElement.setAttribute("data-theme", theme);
        })();
    </script>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Urban Threads | Cart</title>

    <link rel="stylesheet" href="css/style.css">

</head>
<body>

    <!-- ==========================
         Navigation
    =========================== -->

    <nav>

        <div class="nav-container">

            <div class="logo">

                <div class="logo-circle"></div>

                Urban Threads

            </div>

            <div class="nav-links">

                <a href="index.html">Home</a>
                <a href="shop.html">Shop</a>
                <a href="cart.html" class="active">Cart</a>

            </div>

            <div class="nav-right">

                <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark mode">🌙</button>

                <span id="user-email"></span>

                <button
                    id="logout-btn"
                    class="btn btn-primary">

                    Logout

                </button>

            </div>

        </div>

    </nav>

    <!-- ==========================
         Cart
    =========================== -->

    <main>

        <section class="shop-header">

            <h1>Your Cart</h1>

            <p>

                Review your selected items before checkout.

            </p>

        </section>

        <section id="cart-items">

        </section>

        <div class="cart-summary">

            <h2 id="cart-total">

                Total: R0.00

            </h2>

            <button
                id="checkout-btn"
                class="btn btn-primary">

                Proceed to Checkout

            </button>

        </div>

    </main>

    <!-- ==========================
         Footer
    =========================== -->

    <footer>

        <h2>

            Urban Threads

        </h2>

        <p>

            Premium Streetwear • Built with HTML, CSS, JavaScript & Firebase

        </p>

        <p>

            © 2026 Urban Threads. All Rights Reserved.

        </p>

    </footer>

    <script type="module" src="js/theme.js"></script>

    <script type="module" src="js/cart.js"></script>

</body>
</html>
