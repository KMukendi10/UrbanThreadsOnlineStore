<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Urban Threads | Login</title>

    <link rel="stylesheet" href="css/style.css">

</head>
<body>

    <!-- ==========================
         Navigation
    =========================== -->

    <nav>

        <div class="nav-container">

            <div class="logo">

                <div class="logo-circle"></div>

                Urban Threads

            </div>

            <div class="nav-links">

                <a href="index.html">Home</a>
                <a href="shop.html">Shop</a>
                <a href="login.html">Login</a>

            </div>

        </div>

    </nav>

    <!-- ==========================
         Login Section
    =========================== -->

    <section class="login-page">

        <div class="login-image">

            <img
                src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=900"
                alt="Urban Threads">

        </div>

        <div class="login-container">

            <h1>

                Welcome Back

            </h1>

            <p>

                Login to continue shopping at Urban Threads.

            </p>

            <!-- Login Form -->

            <form id="auth-form">

                <input
                    type="email"
                    id="email"
                    placeholder="Email Address"
                    required>

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required>

                <button
                    type="submit"
                    class="btn btn-primary">

                    Login

                </button>

            </form>

            <p id="message"></p>

            <hr>

            <h2>

                New Customer?

            </h2>

            <button
                type="button"
                id="signup-btn"
                class="btn btn-outline">

                Create Account

            </button>

        </div>

    </section>

    <script type="module" src="js/auth.js"></script>

</body>
</html>
