<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urban Threads | Shop</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav>

        <h2>Urban Threads</h2>

        <div class="nav-links">

            <a href="index.html">Home</a>

            <a href="shop.html">Shop</a>

            <a href="cart.html">
                Cart (<span id="cart-count">0</span>)
            </a>

            <span id="user-email"></span>

            <button id="logout-btn">
                Logout
            </button>

        </div>

    </nav>

    <main>

        <h1>Urban Threads Shop</h1>

        <input
            type="text"
            id="search"
            placeholder="Search products..."
        >

        <div class="categories">

            <button class="category-btn active" data-category="All">All</button>
            <button class="category-btn" data-category="Hoodies">Hoodies</button>
            <button class="category-btn" data-category="T-Shirts">T-Shirts</button>
            <button class="category-btn" data-category="Sneakers">Sneakers</button>
            <button class="category-btn" data-category="Accessories">Accessories</button>
            <button class="category-btn" data-category="Jackets">Jackets</button>
            <button class="category-btn" data-category="Bottoms">Bottoms</button>

        </div>

        <section id="products"></section>

    </main>

    <script type="module" src="js/shop.js"></script>

</body>
</html>
